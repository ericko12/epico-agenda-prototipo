<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÉPICO · Agenda móvil · V2</title><style>
:root{--blue:#213f92;--accent:#0e66df;--line:#e4e9f1;--muted:#68748a;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;background:#dfe5ee;font-family:Arial,sans-serif;color:#172033}button,input,select,textarea{font:inherit}.phone{max-width:430px;margin:15px auto;background:white;min-height:850px;position:relative;overflow:hidden}.top{height:62px;background:var(--blue);color:white;padding:0 16px;display:flex;align-items:center}.top b{font-size:17px}.top span{margin-left:auto}.body{background:var(--bg);min-height:788px;padding:15px 15px 85px}.discovery{font-size:11px;background:#fff8df;border:1px solid #ead58c;padding:9px;border-radius:7px}.hello{margin:13px 0}.head{display:flex;align-items:center}.head h1{margin:0;font-size:22px}.add{margin-left:auto;border:0;background:var(--accent);color:white;width:42px;height:42px;border-radius:50%;font-size:24px}.date{margin:14px 0;background:white;border:1px solid var(--line);padding:10px;border-radius:8px}.cards{display:flex;flex-direction:column;gap:9px}.card{background:white;border:1px solid var(--line);border-left:5px solid #258af0;border-radius:8px;padding:12px;text-align:left}.card strong{display:block;margin:4px 0}.card small{color:var(--muted)}.bottom{position:absolute;bottom:0;left:0;right:0;height:68px;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}.bottom button{border:0;background:white;font-size:10px}.sheetbg{position:absolute;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.sheet{background:white;width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:19px}.label{display:block;font-size:12px;margin:11px 0 5px}.input{width:100%;padding:10px;border:1px solid #cbd5e3;border-radius:7px}.primary{width:100%;border:0;background:var(--accent);color:white;padding:12px;border-radius:7px;font-weight:700;margin-top:12px}.ghost{border:1px solid #cbd5e3;background:white;padding:10px;border-radius:7px;margin-top:8px}.geo{padding:12px;border-radius:8px;margin:12px 0}.geo.ok{background:#e9f8ef;border:1px solid #a8d9ba}.geo.out{background:#fff4e8;border:1px solid #edc58f}.warn{background:#fff8df;border:1px solid #ead58c;border-radius:7px;padding:9px;font-size:12px;margin:10px 0}.danger{background:#fff1f1;border:1px solid #e7b5b5;border-radius:7px;padding:10px;font-size:12px;margin:10px 0}.badge{display:inline-block;background:#e8f1ff;color:#174f9c;padding:5px 8px;border-radius:5px;font-size:11px}.task{background:#eef6ff;border:1px solid #c8ddf6;border-radius:8px;padding:10px;margin:8px 0}.fact{margin:12px 0}.fact small{display:block;color:var(--muted)}@media(max-width:480px){body{background:white}.phone{margin:0;max-width:none;min-height:100vh}.body{min-height:calc(100vh - 62px)}}
</style></head><body><main class="phone"><header class="top"><b>ÉPICO · Agenda V2</b><span>●</span></header><section class="body"><div class="discovery"><b>SIMULADOR FUNCIONAL DE DISCOVERY · V2</b></div><div class="hello"><small style="color:var(--muted)">Hola,</small><div style="font-size:18px;font-weight:700">Luis Galvan</div></div><div class="head"><div><h1>Mi agenda</h1><small style="color:var(--muted)">Visitas y actividades asignadas</small></div><button class="add" id="add">＋</button></div><div class="date"><b>Martes 22 de septiembre</b><br><small style="color:var(--muted)">Horario de referencia 08:00–20:00 · Festivos permitidos</small></div><div class="warn"><b>Ruta en análisis</b> · La optimización automática de traslados aún no forma parte de esta simulación.</div><div class="cards" id="cards"></div></section><nav class="bottom"><button>⌂<br>Inicio</button><button>▦<br><b>Agenda</b></button><button id="tasksBtn">✓<br>Tareas</button><button>☰<br>Más</button></nav><div class="sheetbg" id="sheetBg"><div class="sheet" id="sheet"></div></div></main>
<script>
let events=[{id:1,time:'08:30',duration:30,title:'Refaccionaria El Volante',address:'Base Zapopan Norte',status:'Programada',quote:'COT-004821'},{id:2,time:'10:00',duration:30,title:'Autopartes del Bajío',address:'Base Centro',status:'Programada',quote:''},{id:3,time:'11:30',duration:30,title:'Frenos Lara',address:'Base Industrial',status:'Programada',quote:''}];let active=null;const tasks=[{subject:'Enviar cotización solicitada',detail:'Confirmar disponibilidad de balatas y discos.',owner:'Yo mismo',status:'Pendiente'}];const $=s=>document.querySelector(s),mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b};
function render(){ $('#cards').innerHTML=events.map(e=>'<button class="card" data-id="'+e.id+'"><span style="font-size:12px;color:var(--muted)">'+e.time+' · '+e.duration+' min</span><strong>'+e.title+'</strong><small>'+e.address+' · '+e.status+'</small></button>').join('');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>detail(+b.dataset.id))}
function open(html){$('#sheet').innerHTML=html;$('#sheetBg').style.display='flex'}function close(){ $('#sheetBg').style.display='none' }
function detail(id){let e=events.find(x=>x.id===id);open('<span class="badge">'+e.status+'</span><h2>'+e.title+'</h2><div class="fact"><b>'+e.time+' · '+e.duration+' min</b><small>'+e.address+'</small></div>'+(e.quote?'<div class="fact"><b>Cotización</b><small>'+e.quote+'</small></div>':'')+(e.status==='Programada'?'<button class="primary" id="checkin">Iniciar visita / Check-in</button>':'')+'<button class="ghost" id="x">Cerrar</button>');$('#x').onclick=close;let b=$('#checkin');if(b)b.onclick=()=>checkOpen(e)}
function checkOpen(e){let previous=events.find(x=>x.status==='Check-in activo'&&x.id!==e.id);if(previous){open('<span class="badge">Visita abierta</span><h2>Antes de continuar</h2><div class="danger"><b>Tienes una visita sin Check-out</b><br>'+previous.title+' · '+previous.time+'</div><p>Debes resolver la visita anterior antes de iniciar una nueva.</p><button class="primary" id="closePrev">Cerrar visita anterior y continuar</button><button class="ghost" id="cancel">Cancelar</button>');$('#cancel').onclick=close;$('#closePrev').onclick=()=>{previous.status='Cierre regularizado';geo(e,true)};return}geo(e,true)}
function geo(e,inside){active=e;open('<span class="badge">Validación de ubicación</span><h2>'+(inside?'Dentro del rango':'Fuera de rango')+'</h2><div class="geo '+(inside?'ok':'out')+'"><b>'+(inside?'Ubicación dentro de 100 m':'Ubicación mayor a 100 m')+'</b><br><small>Distancia simulada: '+(inside?'74':'380')+' m</small></div>'+(inside?'':'<div class="warn"><b>Advertencia</b> · La visita se registrará como fuera de rango. Puedes continuar; no se bloquea el Check-in.</div>')+'<button class="primary" id="confirm">Confirmar Check-in</button><button class="ghost" id="toggle">Probar escenario '+(inside?'fuera':'dentro')+' de rango</button>');$('#toggle').onclick=()=>geo(e,!inside);$('#confirm').onclick=()=>{e.status=inside?'Check-in activo':'Check-in activo · Fuera de rango';render();visit(e)}}
function visit(e){open('<span class="badge">Check-in activo</span><h2>Visita en curso</h2><div class="fact"><b>'+e.title+'</b><small>'+e.address+'</small></div><label class="label">Objetivo</label><select class="input"><option>Venta</option><option>Cobranza</option><option>Garantías / Devoluciones</option><option>Otro</option></select><label class="label">Cotización relacionada</label><input class="input" value="'+(e.quote||'')+'" placeholder="COT-000123"><label class="label">Resultado</label><select class="input"><option>Cliente atendido</option><option>Seguimiento requerido</option><option>Cliente no disponible</option></select><label class="label">Hallazgos / actividad realizada</label><textarea class="input" rows="3" placeholder="Detalle de la visita"></textarea><button class="primary" id="checkout">Finalizar visita / Check-out</button>');$('#checkout').onclick=()=>{e.status='Check-out realizado';render();followup(e)}}
function followup(e){open('<span class="badge">Check-out realizado</span><h2>Visita finalizada</h2><p>La hora real de ejecución queda registrada para compararla con la planeación.</p><h3>¿Quedó algún pendiente?</h3><button class="primary" id="yes">Sí, crear tarea</button><button class="ghost" id="no">No, finalizar</button>');$('#no').onclick=close;$('#yes').onclick=()=>taskForm(e)}
function taskForm(e){open('<span class="badge">Nueva tarea</span><h2>Seguimiento</h2><label class="label">Asunto</label><input class="input" id="sub" value="Seguimiento de '+e.title+'"><label class="label">Detalle / descripción</label><textarea class="input" id="det" rows="3" placeholder="Describe qué debe realizarse"></textarea><label class="label">Responsable</label><select class="input" id="own"><option>Yo mismo · Asesor</option><option>Equipo Operaciones</option><option>Gerente</option></select><button class="primary" id="save">Crear tarea</button>');$('#save').onclick=()=>{tasks.push({subject:$('#sub').value,detail:$('#det').value,owner:$('#own').value,status:'Pendiente'});showTasks()}}
function showTasks(){open('<span class="badge">Tareas</span><h2>Mis tareas</h2>'+tasks.map(t=>'<div class="task"><b>'+t.subject+'</b><small style="display:block;color:var(--muted)">'+(t.detail||'Sin detalle')+'</small><small>'+t.owner+' · '+t.status+'</small></div>').join('')+'<button class="ghost" id="done">Cerrar</button>');$('#done').onclick=close}
$('#tasksBtn').onclick=showTasks;$('#add').onclick=()=>open('<span class="badge">Nueva actividad</span><h2>Agregar a Agenda</h2><label class="label">Fecha</label><input class="input" type="date" value="2026-09-22"><label class="label">Cliente / razón social</label><select class="input" id="nc"><option>Refaccionaria El Volante</option><option>Autopartes del Bajío</option><option>Frenos Lara</option></select><label class="label">Dirección</label><select class="input" id="na"><option>Base Zapopan Norte</option><option>Base Centro</option><option>Base Industrial</option></select><label class="label">Hora</label><input class="input" id="nt" type="time" value="15:00"><label class="label">Cotización relacionada</label><input class="input" id="nq" placeholder="Opcional"><button class="primary" id="saveNew">Guardar</button>');$('#saveNew').onclick=()=>{let t=$('#nt').value,conf=events.find(x=>mins(t)<mins(x.time)+x.duration&&mins(x.time)<mins(t)+30);if(conf){alert('No se puede guardar: el horario se empalma con '+conf.title+'.');return}events.push({id:Date.now(),time:t,duration:30,title:$('#nc').value,address:$('#na').value,status:'Programada',quote:$('#nq').value});render();close()}};render();
</script></body></html>
